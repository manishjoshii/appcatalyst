apiVersion: apps/v1
kind: Deployment
metadata:
  name: stripe-cli
  namespace: appcatalyst-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stripe-cli
  template:
    metadata:
      labels:
        app: stripe-cli
    spec:
      containers:
        - name: stripe-cli
          image: stripe/stripe-cli:latest
          command:
            - stripe
            - listen
            - --api-key=$(STRIPE_API_KEY)
            - --forward-to=http://account-service:80/account/webhooks/payment
            - --events=checkout.session.completed,customer.subscription.updated,customer.subscription.deleted,invoice.paid,invoice.payment_failed
          env:
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: STRIPE_API_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi