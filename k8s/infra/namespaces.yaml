# k8s/infra/namespaces.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: appcatalyst-core

---
# to create a separate ns for previews

apiVersion: v1
kind: Namespace
metadata:
  name: appcatalyst-previews

---
# configmap for shared config values across services

apiVersion: v1
kind: ConfigMap
metadata:
  name: appcatalyst-shared-config
  namespace: appcatalyst-core
data:
  PREVIEW_DOMAIN: "previews.appcatalyst.manishkjoshi.in"
  PREVIEW_NAMESPACE: "appcatalyst-previews"
  PROXY_PORT: "80"
  APP_FRONTEND_URL: "https://appcatalyst-studio.manishkjoshi.in"
